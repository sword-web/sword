[package]
name = "sword-macros-copy"
version.workspace = true
edition.workspace = true
authors = ["Luciano Revillod <lrevillod2022@alu.uct.cl>"]
description = "Structured web framework built on top of tokio ecosystem, providing powerful features for building robust web applications."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sword-macros"
keywords = ["web", "framework", "axum", "http", "async"]
readme = "README.md"
license.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = { workspace = true }
darling = "0.24.1"

[features]
default = []
web = []
socketio = []

grpc = []
grpc-reflection = []

jobs = []
events = []

hot-reload = []
