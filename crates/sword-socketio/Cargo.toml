[package]
name = "sword-socketio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation = "https://docs.rs/sword"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["framework", "socketio", "sword", "web"]
categories = ["web-programming", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
validator = ["dep:validator"]

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
inventory = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

sword-core = { workspace = true }
sword-macros = { workspace = true, features = ["socketio"] }
sword-web = { workspace = true }

socketioxide = { version = "0.18.9", features = ["extensions", "msgpack"] }
socketioxide-core = "0.20.0"
socketioxide-parser-common = "0.17.3"
socketioxide-parser-msgpack = "0.17.4"

form_urlencoded = { workspace = true }
serde_urlencoded = { workspace = true }
validator = { workspace = true, optional = true }

[dev-dependencies]
axum-test = { workspace = true }
tower-http = { workspace = true, features = ["cors", "limit", "trace"] }
