[package]
name = "sword-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation = "https://docs.rs/sword"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["framework", "grpc", "rpc", "sword", "tonic"]
categories = ["web-programming", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
error-details = ["dep:tonic-types"]
reflection = ["dep:tonic-reflection", "sword-macros/grpc-reflection"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-async-interceptor = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true, optional = true }
tonic-types = { workspace = true, optional = true }

futures-util = { workspace = true }
http = { workspace = true }
tower = { workspace = true, features = ["util"] }

byte-unit = "5.2.0"
sword-core = { workspace = true }
sword-extra = { workspace = true, features = ["request-id"] }
sword-macros = { workspace = true, features = ["grpc"] }

inventory = { workspace = true }
tracing = { workspace = true }
