[package]
name = "sword-grpc"
version.workspace = true
edition.workspace = true
authors = ["luciano revillod <lrevillod2022@alu.uct.cl>"]
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sword"
keywords = ["sword", "grpc", "framework", "tonic", "rpc"]
categories = ["web-programming", "web-programming::http-server"]
readme.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tonic = { workspace = true }
tonic-async-interceptor = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true, optional = true }
tonic-types = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

http = { workspace = true }
tower = { workspace = true }

sword-core = { workspace = true }
sword-layers = { workspace = true, features = ["tracing", "body-limit", "request-id"] }
sword-macros = { workspace = true, features = ["grpc"] }

tracing = { workspace = true }
inventory = { workspace = true }

[features]
default = []
reflection = ["dep:tonic-reflection", "sword-macros/grpc-reflection"]
error-details = ["dep:tonic-types"]
