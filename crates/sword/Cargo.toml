[package]
name = "sword"
version.workspace = true
edition.workspace = true
authors = ["luciano revillod <lrevillod2022@alu.uct.cl>"]
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sword"
keywords = ["sword", "web", "framework", "axum", "microservices"]
categories = ["web-programming", "web-programming::http-server"]
readme.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { workspace = true }

sword-core = { workspace = true }
sword-events = { workspace = true, optional = true }
sword-layers = { workspace = true, features = ["tracing"] }
sword-macros = { workspace = true }
sword-web = { workspace = true, optional = true }
sword-grpc = { workspace = true, optional = true }
sword-socketio = { workspace = true, optional = true }
sword-jobs = { workspace = true, optional = true }

tracing = { workspace = true }
inventory = { workspace = true }
futures-lite = { workspace = true }
toml = "1.1"

subsecond = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }

[features]
default = []

web = ["dep:sword-web"]
web-multipart = ["web", "sword-web/multipart"]
web-swagger-ui = ["web", "sword-web/swagger-ui"]

socketio = ["web", "dep:sword-socketio"]

grpc = ["dep:sword-grpc"]
grpc-reflection = ["grpc", "sword-grpc/reflection"]
grpc-error-details = ["grpc", "sword-grpc/error-details"]

events = ["dep:sword-events"]
events-memory = ["events", "sword-events/memory"]
events-nats = ["events", "sword-events/nats"]

jobs = ["dep:sword-jobs"]

validation-validator = ["sword-web/validation-validator", "sword-socketio?/validation-validator"]
hot-reload = ["dep:subsecond", "dep:dioxus-devtools", "sword-macros/hot-reload"]
