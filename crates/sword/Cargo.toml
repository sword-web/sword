[package]
name = "sword"
version.workspace = true
edition.workspace = true
authors = ["luciano revillod <lrevillod2022@alu.uct.cl>"]
description = "Structured web framework built on top of tokio ecosystem, providing powerful features for building robust web applications."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sword"
keywords = ["sword", "web", "framework", "axum", "microservices"]
categories = ["web-programming", "web-programming::http-server"]
readme = "../README.md"
license-file = "../LICENSE"
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { workspace = true }

sword-core = { workspace = true }
sword-layers = { workspace = true, features = ["tracing"] }
sword-macros = { workspace = true, features = ["web-controllers", "socketio-controllers", "grpc-controllers"] }
sword-web = { workspace = true, optional = true }
sword-grpc = { workspace = true, optional = true }
sword-socketio = { workspace = true, optional = true }

tracing = { workspace = true }
inventory = { workspace = true }
futures-lite = { workspace = true }
toml = "0.9"

subsecond = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }

[features]
default = []

web = ["dep:sword-web"]
socketio = ["web", "dep:sword-socketio"]
grpc = ["dep:sword-grpc"]
grpc-reflection = ["dep:sword-grpc", "sword-grpc/reflection"]

web-multipart = ["sword-web/multipart"]
web-swagger-ui = ["sword-web/swagger-ui"]
validation-validator = ["sword-web/validation-validator", "sword-socketio?/validation-validator"]

hot-reload = ["dep:subsecond", "dep:dioxus-devtools", "sword-macros/hot-reload"]
