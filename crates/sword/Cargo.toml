[package]
name = "sword"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation = "https://docs.rs/sword"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["axum", "framework", "microservices", "sword", "web"]
categories = ["web-programming", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

web = ["dep:sword-web"]
web-compression = ["sword-web/compression", "web"]
web-cors = ["sword-web/cors", "web"]
web-helmet = ["sword-web/helmet", "web"]
web-multipart = ["sword-web/multipart", "web"]
web-servedir = ["sword-web/servedir", "web"]
web-swagger-ui = ["sword-web/swagger-ui", "web"]
web-validator = ["sword-web/validator", "web"]

socketio = ["dep:sword-socketio", "web"]
socketio-validator = ["socketio", "sword-socketio/validator"]

grpc = ["dep:sword-grpc"]
grpc-error-details = ["grpc", "sword-grpc/error-details"]
grpc-reflection = ["grpc", "sword-grpc/reflection"]

events = ["dep:sword-events"]
events-memory = ["events", "sword-events/memory"]
events-nats = ["events", "sword-events/nats"]

jobs = ["dep:sword-jobs"]

hot-reload = ["dep:dioxus-devtools", "dep:subsecond", "sword-macros/hot-reload"]

[dependencies]
tokio = { workspace = true }

sword-core = { workspace = true }
sword-events = { workspace = true, optional = true }
sword-grpc = { workspace = true, optional = true }
sword-jobs = { workspace = true, optional = true }
sword-macros = { workspace = true }
sword-socketio = { workspace = true, optional = true }
sword-web = { workspace = true, optional = true }

futures-lite = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
thisconfig = { workspace = true }
toml = "1.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

dioxus-devtools = { workspace = true, optional = true }
subsecond = { workspace = true, optional = true }
