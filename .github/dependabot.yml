version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "axum-helmet"
          - "syn"
          - "axum-test"
          - "sqlx"
          - "bcrypt"
          - "serial_test"
    open-pull-requests-limit: 10
