name: CI

on:
  workflow_dispatch:
    inputs:
      run_formatting:
        description: "Run formatting checks"
        type: boolean
        default: false
      run_core:
        description: "Run core checks"
        type: boolean
        default: false
      run_web:
        description: "Run web checks"
        type: boolean
        default: false
      run_socketio:
        description: "Run socketio checks"
        type: boolean
        default: false
      run_grpc:
        description: "Run grpc checks"
        type: boolean
        default: false
      run_jobs:
        description: "Run jobs checks"
        type: boolean
        default: false
      run_events:
        description: "Run events checks"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths-ignore:
      - ".editorconfig"
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "*.md"
      - ".vscode/**"
      - ".zed/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".editorconfig"
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "*.md"
      - ".vscode/**"
      - ".zed/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      grpc: ${{ steps.filter.outputs.grpc }}
      web: ${{ steps.filter.outputs.web }}
      socketio: ${{ steps.filter.outputs.socketio }}
      jobs: ${{ steps.filter.outputs.jobs }}
      events: ${{ steps.filter.outputs.events }}
      formatting: ${{ steps.filter.outputs.formatting }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'crates/sword-core/**'
              - 'crates/sword/**'
              - 'crates/sword-layers/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            grpc:
              - 'crates/sword-grpc/**'
              - 'crates/sword-macros/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            web:
              - 'crates/sword-core/**'
              - 'crates/sword/**'
              - 'crates/sword-web/**'
              - 'crates/sword-macros/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            socketio:
              - 'crates/sword-core/**'
              - 'crates/sword/**'
              - 'crates/sword-socketio/**'
              - 'crates/sword-macros/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            jobs:
              - 'crates/sword-core/**'
              - 'crates/sword/**'
              - 'crates/sword-jobs/**'
              - 'crates/sword-macros/**'
              - 'tests/sword-jobs/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            events:
              - 'crates/sword-core/**'
              - 'crates/sword/**'
              - 'crates/sword-events/**'
              - 'crates/sword-macros/**'
              - 'tests/sword-events/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            formatting:
              - '**/*.rs'
              - 'rustfmt.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'

  formatting:
    needs: changes
    if: needs.changes.outputs.formatting == 'true' || inputs.run_formatting == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  core-checks:
    needs: changes
    if: needs.changes.outputs.core == 'true' || inputs.run_core == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Run clippy (sword-core)
        run: cargo clippy -p sword-core --all-targets -- -D warnings

      - name: Run clippy (sword)
        run: cargo clippy -p sword --all-targets -- -D warnings

      - name: Run clippy (sword-layers)
        run: cargo clippy -p sword-layers --all-targets -- -D warnings

      - name: Build docs (sword-core)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword-core --no-deps

      - name: Build docs (sword)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword --no-deps

      - name: Build docs (sword-layers)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword-layers --no-deps

  grpc-checks:
    needs: changes
    if: needs.changes.outputs.grpc == 'true' || inputs.run_grpc == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Run clippy (sword-grpc)
        run: cargo clippy -p sword-grpc --all-targets --all-features -- -D warnings

      - name: Run clippy (sword-macros)
        run: cargo clippy -p sword-macros --all-targets --features grpc -- -D warnings

      - name: Run tests (sword-grpc-tests)
        run: cargo test -p sword-grpc-tests -- --test-threads=1

      - name: Build docs (sword-grpc)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword-grpc --no-deps --all-features

  web-checks:
    needs: changes
    if: needs.changes.outputs.web == 'true' || inputs.run_web == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Run clippy (sword-web)
        run: cargo clippy -p sword-web --all-targets --all-features -- -D warnings

      - name: Run clippy (sword-macros)
        run: cargo clippy -p sword-macros --all-targets --features web -- -D warnings

      - name: Run tests (sword-web-tests)
        run: cargo test -p sword-web-tests

      - name: Build docs (sword-web)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword-web --no-deps --all-features

  socketio-checks:
    needs: changes
    if: needs.changes.outputs.socketio == 'true' || inputs.run_socketio == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Run clippy (sword-socketio)
        run: cargo clippy -p sword-socketio --all-targets --all-features -- -D warnings

      - name: Run clippy (sword-macros)
        run: cargo clippy -p sword-macros --all-targets --features socketio -- -D warnings

      - name: Run tests (sword-socketio-tests)
        run: cargo test -p sword-socketio-tests

      - name: Build docs (sword-socketio)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword-socketio --no-deps --all-features

  jobs-checks:
    needs: changes
    if: needs.changes.outputs.jobs == 'true' || inputs.run_jobs == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Run clippy (sword-jobs)
        run: cargo clippy -p sword-jobs --all-targets -- -D warnings

      - name: Run clippy (sword-macros)
        run: cargo clippy -p sword-macros --all-targets --features jobs -- -D warnings

      - name: Run tests (sword-jobs-tests)
        run: cargo test -p sword-jobs-tests

      - name: Build docs (sword-jobs)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword-jobs --no-deps

  events-checks:
    needs: changes
    if: needs.changes.outputs.events == 'true' || inputs.run_events == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Run clippy (sword-events)
        run: cargo clippy -p sword-events --all-targets --all-features -- -D warnings

      - name: Run clippy (sword-macros)
        run: cargo clippy -p sword-macros --all-targets --features events -- -D warnings

      - name: Run tests (sword-events-tests)
        run: cargo test -p sword-events-tests

      - name: Build docs (sword-events)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p sword-events --no-deps --all-features

  deps-checks:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Check workspace compiles
        run: cargo check --workspace --all-targets --locked
