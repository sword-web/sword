[application]
name = "Mixed Test App"

[web]
host = "127.0.0.1"
port = 8082
body-limit = "1MB"

[grpc]
host = "127.0.0.1"
port = 50052

[grpc.body-limit]
max-decoding-message-size = "2 MiB"
max-encoding-message-size = "2 MiB"
display = false

[tracing]
enabled = true
filter = "error"
format = "dev"
time-style = "none"
time-pattern = "%H:%M:%S"
with-fields = []
