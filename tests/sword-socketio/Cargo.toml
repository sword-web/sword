[package]
name = "sword-socketio-tests"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
sword = {
    workspace = true,
    features = [
        "socketio",
        "socketio-validator",
        "web-compression",
        "web-cors",
        "web-helmet",
    ]
}

tokio = { workspace = true }
tower-http = { workspace = true, features = ["cors", "limit", "trace"] }

axum-test = { workspace = true }
serde_json = { workspace = true }
