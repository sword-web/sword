[application]
name = "SocketIO Application Example"
graceful-shutdown = false

[web]
host = "0.0.0.0"
port = 8081
body-limit = "5MB"
router-prefix = "/api"

[socketio]
parser = "common"
transports = ["websocket", "polling"]

[tracing]
enabled = true
filter = "debug"
format = "dev"
time-style = "none"
with-fields = []

[cors]
allow-origins = ["http://localhost:5173"]
allow-methods = ["GET", "POST", "OPTIONS"]
allow-headers = ["Content-Type", "Authorization"]
allow-credentials = true
display = true
