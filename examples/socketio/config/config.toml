[application]
name = "SocketIO Application Example"

[web]
host = "0.0.0.0"
port = 8082
body-limit = "5MB"
router-prefix = "/api"

[socketio]
parser = "common"
transports = ["websocket"]

[tracing]
enabled = true
filter = "debug"
format = "dev"
time-style = "none"
with-fields = []

[cors]
allow-origins = ["http://localhost:5173"]
allow-methods = ["GET", "POST", "OPTIONS"]
allow-headers = ["Content-Type", "Authorization", "x-custom-header"]
allow-credentials = true
display = true

[serve-dir]
static-dir = "public"
router-path = "/static"
not-found-file = "404.html"
display = true
