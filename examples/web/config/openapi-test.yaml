openapi: "3.1.0"
info:
  title: Sword Utility Endpoints
  description: |
    Utility endpoint for the Sword web framework example:
    health check.
  version: "1.0.0"

servers:
  - url: http://localhost:8081
    description: Local development server

paths:
  /api/health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      description: Returns a simple health status to verify the server is running.
      tags: [System]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful
        code:
          type: integer
          format: int32
          description: HTTP status code
        message:
          type: string
          description: Human-readable status message
        request_id:
          type: string
          nullable: true
          description: Unique request identifier for tracing
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 response timestamp
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true
        errors:
          type: array
          items:
            type: object
          nullable: true

    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            message:
              example: "healthy"

    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          format: int32
        message:
          type: string
        request_id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        error:
          type: object
          nullable: true
