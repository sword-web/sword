[application]
name = "Web Application Example"

[web]
host = "0.0.0.0"
port = 8081
body-limit = "5MB"
request-timeout = { enabled = true, timeout = "15s" }
router-prefix = "/api"

[web.logger]
enabled = true
log-query = false
skip-paths = ["/api/health", "/api/static"]

[web.openapi]
title = "Web Application API"
version = "1.0.0"
description = "API documentation for the Web Application Example"
spec-file-paths = ["config/openapi.yaml", "config/openapi-test.yaml"]

[tracing]
enabled = true
filter = "info,sqlx=error"
format = "dev"
time-style = "none"
with-fields = []

[compression]
display = true
algorithms = ["gzip", "br"]

[cors]
display = true

[serve-dir]
display = true
static-dir = "public"
router-path = "/static"

[hasher]
memory-kib = 19456
time = 2
parallelism = 1

[sqlite]
path = ":memory:"
max-connections = 1
create-if-missing = true
migrations-path = "migrations"

[redis]
url = "redis://127.0.0.1:6379"
ttl-ms = 60000
prefix = "sword:web"
connection-timeout-ms = 500
response-timeout-ms = 500
